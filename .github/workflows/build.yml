name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Compile with NDK
        run: |
          $ANDROID_NDK_HOME/ndk-build

      - name: Generate Tag Name
        id: tag
        run: |
          echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "Release ${{ steps.tag.outputs.TAG_NAME }}"
          body: |
            ## Automated Build Completed
            
            ### Binary File
            - Attached: `liblibrary.so` (Architecture: `arm64-v8a`)
            - Target Package: `com.v2cross.shadowshare`
            
            ---
            
            ### Smali Call Code (Add to classes.dex):
            ```smali
            const-string v0, "library"
            invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V
            ```
            
            ### Java Call Code (Reference):
            ```java
            System.loadLibrary("mylib");
            ```
          files: |
            libs/arm64-v8a/libmylib.so
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
